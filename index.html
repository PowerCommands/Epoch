<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <title>Strategy Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-panel: #0d0d0d;
        --bg-section: #1a1a1a;
        --bg-hover: #252525;
        --text-primary: #e0e0e0;
        --text-muted: #888;
        --border: #333;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
      }

      #app-layout {
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      #game-container {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
      }

      #panel-right {
        display: none;
      }

      /* LEGACY: left HTML panel is no longer part of the active gameplay UI.
         Kept as an inert placeholder while cleanup continues. */
      #panel-left {
        left: 0;
        width: 0;
        height: 0;
        padding: 0;
        overflow: visible;
        background: transparent;
        pointer-events: none;
        z-index: 20;
      }

      .html-panel {
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .panel-section {
        background: var(--bg-section);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        margin-bottom: 10px;
      }

      .panel-heading {
        color: var(--text-muted);
        font-size: 11px;
        letter-spacing: 1px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }

      .panel-large {
        color: var(--text-primary);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.15;
      }

      .end-turn-button {
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        margin: 2px 0 8px;
        border: 1px solid rgba(84, 45, 15, 0.7);
        border-radius: 8px;
        background: linear-gradient(180deg, #c27821, #9a5415);
        color: #fff7e7;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.14s ease, opacity 0.14s ease, filter 0.14s ease;
      }

      .end-turn-button:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .end-turn-button:disabled {
        cursor: not-allowed;
      }

      .turn-active-nation {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
      }

      /* LEGACY: old HTML action toolbox styles retained only until the
         remaining legacy HTML classes are removed completely. */
      .unit-action-toolbox {
        margin: 2px 0 8px;
      }

      .unit-action-toolbox-hidden {
        display: none;
      }

      .unit-action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .unit-action-button {
        min-height: 30px;
        padding: 5px 7px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #171717;
        color: var(--text-primary);
        cursor: pointer;
        flex: 1 1 calc(50% - 4px);
        font: inherit;
        font-size: 11px;
        line-height: 1.1;
      }

      .unit-action-button:hover {
        background: var(--bg-hover);
        border-color: #5d5d5d;
      }

      .unit-action-button-active {
        background: #1a2a1a;
        border-color: #d4a857;
        color: #fff7e7;
      }

      .unit-action-button-danger {
        border-color: #6a2a2a;
        color: #f0a898;
      }

      .unit-action-button-danger:hover {
        background: #2a1414;
        border-color: #b54747;
      }

      .panel-muted {
        color: var(--text-muted);
      }

      .research-subheading {
        color: var(--text-muted);
        font-size: 11px;
        margin-top: 8px;
        text-transform: uppercase;
      }

      .research-tech-button {
        width: 100%;
        margin-top: 4px;
        padding: 5px 6px;
        border: 1px solid #4a6a4a;
        border-radius: 4px;
        background: #1f2f1f;
        color: #b7dfb7;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        text-align: left;
      }

      .research-tech-button:hover {
        background: #2b442b;
        color: #e1ffe1;
      }

      .panel-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }

      .panel-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
      }

      .nation-swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
        display: inline-block;
      }

      .nation-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        cursor: pointer;
        border-radius: 3px;
        border-left: 3px solid transparent;
        font-size: 12px;
      }

      .nation-row:hover {
        background: var(--bg-hover, #1a1f2a);
      }

      .nation-row-selected {
        background: #1a2a1a;
        border-left-color: #d4a857;
      }

      .leader-portrait-button {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 7px 4px;
        margin: 4px 0;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        font: inherit;
      }

      .leader-portrait-button:hover {
        background: var(--bg-hover);
        border-color: var(--border);
      }

      .leader-nation-name {
        width: 100%;
        font-size: 10px;
        font-weight: 700;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .leader-name {
        width: 100%;
        color: var(--text-muted);
        font-size: 10px;
        line-height: 1.15;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .leader-portrait,
      .leader-portrait-fallback {
        width: min(64px, 7vw);
        height: min(82px, 9vw);
        border-radius: 50% / 43%;
        border: 1px solid #4a3a2a;
        background: #151515;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .leader-portrait {
        object-fit: cover;
      }

      .leader-portrait-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 20px;
      }

      .leader-detail-portrait,
      .leader-detail-fallback {
        width: 100%;
        max-width: 150px;
        aspect-ratio: 3 / 4;
        border-radius: 50% / 43%;
        border: 1px solid #5a4a35;
        background: #151515;
        display: block;
        margin: 0 auto 10px;
      }

      .leader-detail-portrait {
        object-fit: cover;
      }

      .leader-detail-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 32px;
      }

      .nation-city-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin: 2px 0;
      }

      .panel-city-button,
      .production-row,
      .found-city-button {
        border: 0;
        color: var(--text-primary);
        font: inherit;
      }

      .panel-city-button {
        background: transparent;
        cursor: pointer;
        font-weight: 700;
        padding: 0;
        text-align: left;
      }

      .panel-city-button:hover,
      .found-city-button:hover {
        color: #fff;
      }

      .hp-bar {
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0 6px;
      }

      .hp-fill {
        height: 100%;
        background: #4a9;
      }

      .production-row {
        width: 100%;
        display: block;
        padding: 6px 8px;
        border-radius: 4px;
        background: transparent;
        text-align: left;
        cursor: pointer;
        margin: 3px 0;
        border-left: 3px solid transparent;
      }

      .production-row:hover {
        background: var(--bg-hover);
      }

      .production-row.active {
        background: #1f1f1f;
      }

      .found-city-button {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg-section);
        cursor: pointer;
      }

      .score-dead {
        color: var(--text-muted);
        text-decoration: line-through;
      }

      .panel-separator {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 12px 0;
      }

      .queue-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 3px;
        margin: 2px 0;
        font-size: 12px;
        position: relative;
      }

      .queue-row.queue-active {
        background: #1a2a1a;
        border-left: 3px solid #4a9;
      }

      .queue-row span:first-child {
        flex: 1;
        min-width: 0;
      }

      .queue-progress {
        width: 100%;
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
      }

      .queue-progress-fill {
        height: 100%;
        background: #4a9;
      }

      .queue-remove-btn {
        background: transparent;
        border: 1px solid #666;
        color: #999;
        font-size: 14px;
        line-height: 1;
        width: 20px;
        height: 20px;
        padding: 0;
        cursor: pointer;
        border-radius: 3px;
        flex-shrink: 0;
      }

      .queue-remove-btn:hover {
        background: #600;
        color: #fff;
        border-color: #a00;
      }

      .queue-add-btn {
        width: 100%;
        margin-top: 4px;
        padding: 5px 6px;
        border: 1px solid #4a6a4a;
        border-radius: 4px;
        background: #1f2f1f;
        color: #b7dfb7;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        text-align: left;
      }

      .queue-add-btn:hover {
        background: #2b442b;
        color: #e1ffe1;
      }

      .panel-content {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
      }

      .event-log {
        flex: 0 0 auto;
        margin-top: 8px;
        margin-bottom: 0;
        max-height: 32vh;
        display: flex;
        flex-direction: column;
      }

      .event-log-list {
        overflow-y: auto;
        flex: 1 1 auto;
        min-height: 0;
        font-size: 11px;
        line-height: 1.35;
      }

      .event-log-row {
        display: flex;
        gap: 6px;
        padding: 3px 2px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .event-log-row:last-child {
        border-bottom: 0;
        background: rgba(212, 168, 87, 0.08);
      }

      .event-log-turn {
        color: var(--text-muted);
        flex-shrink: 0;
        width: 28px;
      }

      .event-log-text {
        color: var(--text-primary);
        word-break: break-word;
      }

      .event-log-empty {
        font-size: 11px;
        font-style: italic;
      }

      .city-view-overlay {
        position: fixed;
        left: 12vw;
        top: 18px;
        z-index: 1200;
        width: min(760px, 64vw);
        pointer-events: none;
      }

      .city-view-panel {
        background: linear-gradient(180deg, #10283e, #050d16);
        border: 1px solid #b88a43;
        border-radius: 14px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
        color: #e6edf3;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', Arial, sans-serif;
        max-height: calc(100vh - 36px);
        overflow: hidden;
        padding: 18px 20px;
        box-sizing: border-box;
        pointer-events: auto;
      }

      .city-view-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 15px;
        cursor: move;
        user-select: none;
      }

      .city-view-title {
        font-size: 28px;
        font-family: Georgia, 'Times New Roman', serif;
        color: #e8c789;
        overflow-wrap: anywhere;
        font-weight: 700;
        line-height: 1.1;
      }

      .city-view-close {
        border: 1px solid rgba(184, 138, 67, 0.5);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        color: #f2f5ea;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        padding: 9px 15px;
      }

      .city-view-close:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .city-view-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px 18px;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .city-view-stat {
        padding: 9px 12px;
        border: 1px solid rgba(184, 138, 67, 0.2);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.03);
      }

      .city-view-stat-blocked {
        color: #ff6b6b;
        border-color: rgba(255, 107, 107, 0.5);
        background: rgba(255, 107, 107, 0.08);
      }

      .city-view-next,
      .city-view-hint {
        font-size: 14px;
        line-height: 1.4;
      }

      .city-view-next {
        color: #ffe08f;
        margin-bottom: 12px;
      }

      .city-view-placement {
        margin-bottom: 15px;
        padding: 15px;
        border: 1px solid rgba(184, 138, 67, 0.2);
        border-radius: 12px;
        background: rgba(3, 12, 22, 0.5);
      }

      .city-view-current-production {
        color: #dcecf0;
        font-size: 14px;
      }

      .city-view-placement-status {
        font-size: 14px;
        color: #dcecf0;
        margin-bottom: 12px;
      }

      .city-view-placement-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .city-view-placement-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .city-view-mode-buttons {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        margin-bottom: 15px;
      }

      .city-view-mode-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }

      .city-view-mode-button {
        min-width: 110px;
      }

      .city-view-auto-close {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        font-size: 12px;
        color: #bdcbd6;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .city-view-auto-close input {
        width: 16px;
        height: 16px;
        accent-color: #c9a660;
        cursor: pointer;
      }

      .city-view-accordion-header {
        width: 100%;
        border: 0;
        background: transparent;
        color: #dcecf0;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 0;
        text-align: left;
      }

      .city-view-unit-heading {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .city-view-unit-heading > .city-view-accordion-header { width: auto; flex: 0 0 auto; }
      .city-view-unit-filters { display: flex; flex-wrap: wrap; gap: 5px; }
      .city-view-unit-filter {
        border: 1px solid transparent;
        border-radius: 5px;
        background: transparent;
        color: #a9bccb;
        font: inherit;
        font-size: 12px;
        line-height: 1.5;
        padding: 3px 6px;
        cursor: pointer;
      }
      .city-view-unit-filter:hover { color: #e8c789; background: #18354e; }
      .city-view-unit-filter[aria-pressed="true"] {
        color: #e8c789;
        border-color: #b88a43;
        background: rgba(184, 138, 67, 0.18);
      }
      .city-view-production-grid > .city-view-placement-empty { grid-column: 1 / -1; }

      .city-view-production-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .city-view-placement-button,
      .city-view-placement-cancel {
        border: 1px solid rgba(184, 138, 67, 0.5);
        border-radius: 6px;
        background: rgba(24, 49, 72, 0.7);
        color: #eef5f2;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        padding: 9px 14px;
      }

      .city-view-placement-button:hover:not(:disabled):not(.city-view-placement-button-disabled),
      .city-view-placement-cancel:hover {
        background: rgba(40, 70, 97, 0.85);
      }

      .city-view-placement-button-active {
        border-color: #e8c789;
        background: rgba(184, 138, 67, 0.18);
        color: #effdff;
      }

      .city-view-placement-button:disabled,
      .city-view-placement-button-disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }

      .city-view-production-button {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        height: auto;
        justify-content: flex-start;
        min-height: 112px;
        width: 100%;
        text-align: left;
      }

      .city-view-production-icon {
        width: 80px;
        height: 88px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .city-view-production-label {
        min-width: 0;
        display: grid;
        gap: 6px;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .city-view-placement-empty {
        font-size: 14px;
        color: #93a5a8;
      }

      .city-view-queue-item {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }

      .city-view-queue-item:first-of-type {
        border-top: 0;
      }

      .city-view-queue-body {
        min-width: 0;
      }

      .city-view-queue-title {
        color: #eef5f2;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.25;
      }

      .city-view-queue-meta {
        color: #a9bccb;
        font-size: 12px;
        margin-top: 4px;
      }

      .city-view-queue-progress {
        height: 8px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .city-view-queue-progress > div {
        height: 100%;
        background: #c9a660;
      }

      .city-view-queue-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .city-view-hint {
        color: #a9bccb;
      }

      @media (max-width: 900px) {
        .city-view-overlay {
          left: 12px;
          width: calc(100vw - 24px);
        }

        .city-view-production-grid {
          grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
        }

        .city-view-queue-item {
          grid-template-columns: 88px minmax(0, 1fr);
        }

        .city-view-queue-actions {
          grid-column: 1 / -1;
          flex-direction: row;
        }
      }

      .city-view-panel button:focus-visible {
        outline: 2px solid #e8c789;
        outline-offset: 3px;
      }
      .city-view-mode-content {
        scrollbar-width: thin;
        scrollbar-color: #8a693a #08131d;
      }
      .city-view-production-button { padding: 10px; }
      .city-view-production-icon {
        background: radial-gradient(ellipse, rgba(111, 157, 189, 0.2), transparent 72%);
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.45));
        transition: transform 160ms ease;
      }
      .city-view-production-button:hover .city-view-production-icon,
      .city-view-production-button:focus-visible .city-view-production-icon,
      .city-view-queue-preview:hover .city-view-production-icon { transform: scale(1.12); }
      .city-view-production-label strong { font-size: 14px; line-height: 1.3; }
      .city-view-production-cost { font-size: 12px; color: #e8c789; }
      .city-view-production-requirement { font-size: 11px; color: #d9b6a0; line-height: 1.35; }
      .city-view-accordion-header { color: #e8c789; padding: 3px 0; letter-spacing: 0.04em; }
      .city-view-queue-preview {
        padding: 0;
        border: 1px solid rgba(184, 138, 67, 0.3);
        border-radius: 8px;
        background: #10263a;
        cursor: zoom-in;
      }
      .city-view-queue-item-active { box-shadow: inset 2px 0 #b88a43; padding-left: 10px; }
      .city-view-queue-progress > div { background: linear-gradient(90deg, #987039, #e8c789); }
      .city-view-tooltip {
        position: fixed;
        z-index: 1300;
        display: none;
        width: 290px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px;
        border: 1px solid #b88a43;
        border-radius: 10px;
        background: linear-gradient(160deg, #18354e, #060e18);
        color: #e6edf3;
        box-shadow: 0 14px 40px #0009;
        font: 13px/1.5 'Segoe UI', Arial, sans-serif;
        pointer-events: none;
      }
      .city-view-tooltip div + div { margin-top: 5px; }
      .city-view-preview-image {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: contain;
        margin-bottom: 12px;
        background: radial-gradient(ellipse, #42617a66, transparent 72%);
        filter: drop-shadow(0 5px 8px #0008);
      }
      @media (max-width: 520px) {
